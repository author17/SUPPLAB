<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checkout cancelled | SUPPLAB</title>
<link rel="icon" href="icon-192.png">
<style>
  :root{ --lime:#D4FF00; --black:#0B0D0E; --graphite:#171A1C; --text:#F2F2EE; --muted:#A9ABA5; --border:#2A2E31; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
        background:var(--black); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
  .card{ width:100%; max-width:520px; background:var(--graphite); border:1px solid var(--border); border-radius:16px;
         padding:36px 28px; text-align:center; }
  .mark{ width:64px; height:64px; margin:0 auto 18px; border-radius:50%; border:2px solid var(--muted); color:var(--muted);
         display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900; }
  h1{ margin:0 0 10px; font-size:26px; letter-spacing:.01em; }
  p{ margin:0 0 14px; line-height:1.55; color:var(--muted); font-size:15px; }
  a.btn{ display:inline-block; margin-top:8px; padding:13px 28px; border-radius:999px; background:var(--lime); color:var(--black);
         font-weight:900; text-decoration:none; font-size:14px; letter-spacing:.03em; }
  a.btn:hover{ filter:brightness(.92); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">&times;</div>
    <h1>Checkout cancelled</h1>
    <p>No payment was taken. Your items are still waiting for you whenever you are ready to try again.</p>
    <a class="btn" href="/">Return to shop</a>
  </main>
</body>
</html>
