<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="google" content="notranslate">
<meta name="color-scheme" content="light only">
<title>Order received | SUPPLAB</title>
<link rel="icon" href="icon-192.png">
<style>
  :root{ --lime:#D4FF00; --lime-dark:#AACC00; --black:#0B0D0E; --graphite:#171A1C; --text:#F2F2EE; --muted:#A9ABA5; --border:#2A2E31; }
  *{ box-sizing:border-box; }
  html{ color-scheme:only light; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--black); color:var(--text);
        font-family:Arial,Helvetica,sans-serif; }
  html[dir="rtl"] body{ direction:rtl; }
  .hdr{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 4%;
        background:linear-gradient(100deg,transparent 35%,rgba(212,255,0,.10) 50%,transparent 65%),
                   linear-gradient(120deg,#0d1a00 0%,#0B0D0E 22%,#24292c 50%,#0B0D0E 78%,#0d1a00 100%);
        border-bottom:1px solid rgba(212,255,0,.4); box-shadow:inset 0 -2px 0 rgba(212,255,0,.45); }
  .hdr a.logo{ display:block; line-height:0; }
  .hdr img.logo-img{ height:46px; width:auto; display:block; }
  .langs{ display:flex; gap:6px; flex-wrap:wrap; }
  .langs button{ display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:999px; cursor:pointer;
        background:rgba(255,255,255,.06); color:var(--text); border:1px solid var(--border); font:700 12px Arial,sans-serif; }
  .langs button img{ width:20px; height:14px; border-radius:2px; display:block; }
  .langs button[aria-pressed="true"]{ background:var(--lime); color:var(--black); border-color:var(--lime); }
  main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:36px 16px 48px; }
  .card{ width:100%; max-width:560px; background:var(--graphite); border:1px solid var(--border); border-radius:16px;
         padding:34px 26px; text-align:center; }
  .tick{ width:64px; height:64px; margin:0 auto 16px; border-radius:50%; background:var(--lime); color:var(--black);
         display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:900; }
  h1{ margin:0 0 10px; font-size:26px; letter-spacing:.01em; }
  p{ margin:0 0 14px; line-height:1.55; color:var(--muted); font-size:15px; }
  .order{ display:inline-block; margin:6px 0 18px; padding:8px 16px; border:1px solid var(--lime); border-radius:999px;
          color:var(--lime); font-weight:700; letter-spacing:.04em; }
  [hidden]{ display:none !important; }
  .sum{ margin:8px 0 18px; text-align:start; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.02); }
  .sum h2{ margin:0; padding:12px 16px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--lime);
           border-bottom:1px solid var(--border); }
  .line{ display:flex; justify-content:space-between; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); font-size:14px; }
  .line .nm{ flex:1; min-width:0; }
  .line .nm small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .line .pr{ white-space:nowrap; font-weight:700; }
  .row{ display:flex; justify-content:space-between; gap:12px; padding:9px 16px; font-size:14px; color:var(--muted); }
  .row.total{ color:var(--text); font-weight:900; font-size:16px; border-top:1px solid var(--border); padding:13px 16px; }
  .row.total span:last-child{ color:var(--lime); }
  .mail{ font-size:14px; }
  .mail b{ color:var(--text); }
  a.btn{ display:inline-block; margin-top:6px; padding:13px 28px; border-radius:999px; background:var(--lime); color:var(--black);
         font-weight:900; text-decoration:none; font-size:14px; letter-spacing:.03em; }
  a.btn:hover{ filter:brightness(.92); }
  footer{ padding:18px 4%; text-align:center; font-size:12px; color:var(--muted); border-top:1px solid var(--border); background:#08090a; }
  footer a{ color:var(--lime); text-decoration:none; }
  .pr, .row span:last-child{ direction:ltr; unicode-bidi:isolate; }
  .line .nm, .line .nm small{ unicode-bidi:plaintext; }
  html[dir="rtl"] .line .nm small{ text-align:right; }
  @media(max-width:520px){ .hdr img.logo-img{ height:38px; } .langs button span{ display:none; } .card{ padding:28px 16px; } h1{ font-size:22px; } }
</style>
</head>

    <div class="sum" id="sum" hidden>
      <h2 data-t="summary">Order summary</h2>
      <div id="lines"></div>
      <div class="row" id="rowItems"><span data-t="items">Items</span><span id="vItems"></span></div>
      <div class="row" id="rowDisc" hidden><span id="lDisc"></span><span id="vDisc"></span></div>
      <div class="row" id="rowShip"><span data-t="shipping">Shipping</span><span id="vShip"></span></div>
      <div class="row total"><span data-t="total">Total paid</span><span id="vTotal"></span></div>
    </div>

    <p class="mail" id="mailLine" hidden><span data-t="mail">Order updates will be sent to</span> <b id="mailAddr"></b></p>
    <p data-t="keep">Keep your order number for any questions about it.</p>
    <a class="btn" href="/" data-t="continue">Continue shopping</a>
  </section>
</main>

<footer>
  <a href="/">SUPPLAB</a> &middot; <span data-t="tag">Sports Nutrition</span> &middot; <span id="yr"></span>
</footer>

<script>
(function(){
  var FLAG = {"EN": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2060%2040%22%3E%3Crect%20width%3D%2260%22%20height%3D%2240%22%20fill%3D%22%23012169%22%2F%3E%3Cpath%20d%3D%22M0%2C0L60%2C40M60%2C0L0%2C40%22%20stroke%3D%22%23fff%22%20stroke-width%3D%228%22%2F%3E%3Cpath%20d%3D%22M0%2C0L60%2C40M60%2C0L0%2C40%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M30%2C0V40M0%2C20H60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%2F%3E%3Cpath%20d%3D%22M30%2C0V40M0%2C20H60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%227%22%2F%3E%3C%2Fsvg%3E", "EL": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2027%2018%22%3E%3Crect%20width%3D%2227%22%20height%3D%2218%22%20fill%3D%22%230D5EAF%22%2F%3E%3Cg%20fill%3D%22%23fff%22%3E%3Crect%20y%3D%222%22%20width%3D%2227%22%20height%3D%222%22%2F%3E%3Crect%20y%3D%226%22%20width%3D%2227%22%20height%3D%222%22%2F%3E%3Crect%20y%3D%2210%22%20width%3D%2227%22%20height%3D%222%22%2F%3E%3Crect%20y%3D%2214%22%20width%3D%2227%22%20height%3D%222%22%2F%3E%3C%2Fg%3E%3Crect%20width%3D%2210%22%20height%3D%2210%22%20fill%3D%22%230D5EAF%22%2F%3E%3Crect%20x%3D%224%22%20width%3D%222%22%20height%3D%2210%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20y%3D%224%22%20width%3D%2210%22%20height%3D%222%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E", "DE": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%205%203%22%3E%3Crect%20width%3D%225%22%20height%3D%223%22%20fill%3D%22%23FFCE00%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%222%22%20fill%3D%22%23D00%22%2F%3E%3Crect%20width%3D%225%22%20height%3D%221%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E", "RU": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%209%206%22%3E%3Crect%20width%3D%229%22%20height%3D%226%22%20fill%3D%22%23D52B1E%22%2F%3E%3Crect%20width%3D%229%22%20height%3D%224%22%20fill%3D%22%230039A6%22%2F%3E%3Crect%20width%3D%229%22%20height%3D%222%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E", "HE": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2022%2016%22%3E%3Crect%20width%3D%2222%22%20height%3D%2216%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20y%3D%221.8%22%20width%3D%2222%22%20height%3D%222.2%22%20fill%3D%22%230038B8%22%2F%3E%3Crect%20y%3D%2212%22%20width%3D%2222%22%20height%3D%222.2%22%20fill%3D%22%230038B8%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%230038B8%22%20stroke-width%3D%22.7%22%3E%3Cpath%20d%3D%22M11%204.6L14.2%2010.2H7.8Z%22%2F%3E%3Cpath%20d%3D%22M11%2011.4L7.8%205.8H14.2Z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"};
  var T = {
    en:{ title:'Thank you for your order', order:'Order', paid:'Your payment was received and your order is being processed.',
         summary:'Order summary', items:'Items', shipping:'Shipping', free:'FREE', total:'Total paid', discount:'Discount',
         mail:'Order updates will be sent to', keep:'Keep your order number for any questions about it.',
         'continue':'Continue shopping', tag:'Sports Nutrition', pg:'Order received' },
    el:{ title:'Ευχαριστούμε για την παραγγελία σας', order:'Παραγγελία', paid:'Η πληρωμή σας ελήφθη και η παραγγελία σας επεξεργάζεται.',
         summary:'Σύνοψη παραγγελίας', items:'Προϊόντα', shipping:'Αποστολή', free:'ΔΩΡΕΑΝ', total:'Συνολικό ποσό', discount:'Έκπτωση',
         mail:'Ενημερώσεις για την παραγγελία θα σταλούν στο', keep:'Κρατήστε τον αριθμό παραγγελίας για οποιαδήποτε απορία.',
         'continue':'Συνέχεια αγορών', tag:'Αθλητική διατροφή', pg:'Η παραγγελία ελήφθη' },
    de:{ title:'Vielen Dank für Ihre Bestellung', order:'Bestellung', paid:'Ihre Zahlung ist eingegangen und Ihre Bestellung wird bearbeitet.',
         summary:'Bestellübersicht', items:'Artikel', shipping:'Versand', free:'KOSTENLOS', total:'Gesamtbetrag', discount:'Rabatt',
         mail:'Bestellinformationen werden gesendet an', keep:'Bewahren Sie Ihre Bestellnummer für Rückfragen auf.',
         'continue':'Weiter einkaufen', tag:'Sporternährung', pg:'Bestellung erhalten' },
    ru:{ title:'Спасибо за ваш заказ', order:'Заказ', paid:'Ваш платёж получен, заказ обрабатывается.',
         summary:'Состав заказа', items:'Товары', shipping:'Доставка', free:'БЕСПЛАТНО', total:'Итого оплачено', discount:'Скидка',
         mail:'Информация о заказе будет отправлена на', keep:'Сохраните номер заказа на случай вопросов.',
         'continue':'Продолжить покупки', tag:'Спортивное питание', pg:'Заказ получен' },
    he:{ title:'תודה על ההזמנה שלך', order:'הזמנה', paid:'התשלום שלך התקבל וההזמנה שלך בטיפול.',
         summary:'סיכום הזמנה', items:'מוצרים', shipping:'משלוח', free:'חינם', total:'סה״כ שולם', discount:'הנחה',
         mail:'עדכונים על ההזמנה יישלחו אל', keep:'שמרו את מספר ההזמנה לכל שאלה.',
         'continue':'המשך קנייה', tag:'תזונת ספורט', pg:'ההזמנה התקבלה' }
  };
  var LOC = { en:'en-GB', el:'el-GR', de:'de-DE', ru:'ru-RU', he:'he-IL' };
  var NAMES = { en:'English', el:'Ελληνικά', de:'Deutsch', ru:'Русский', he:'עברית' };
  var KEY = 'supplab_lang', lang = 'en';
  try{ var s = (localStorage.getItem(KEY)||'').toLowerCase(); if(T[s]) lang = s; }catch(e){}

  // ---- the order summary (saved in THIS browser by the shop right before it sent you to Stripe) ----
  var q = new URLSearchParams(location.search).get('order') || '';
  var okId = /^\d{1,12}$/.test(q);
  var snap = null;
  try{
    var raw = JSON.parse(localStorage.getItem('supplab_last_order') || 'null');
    if(raw && okId && String(raw.order) === q && raw.t && (Date.now() - raw.t) < 7*24*3600*1000) snap = raw;
  }catch(e){}

  function eur(cents){
    var v = (Number(cents)||0)/100;
    try{ return new Intl.NumberFormat(LOC[lang], { style:'currency', currency:'EUR' }).format(v); }
    catch(e){ return '€' + v.toFixed(2); }
  }
  function $(id){ return document.getElementById(id); }

  function render(){
    var d = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'he') ? 'rtl' : 'ltr';
    document.title = d.pg + ' | SUPPLAB';
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function(el){
      var k = el.getAttribute('data-t'); if(d[k] != null) el.textContent = d[k];
    });
    Array.prototype.forEach.call($('langs').children, function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    if(snap){
      var box = $('lines'); box.textContent = '';
      (snap.lines||[]).forEach(function(l){
        var row = document.createElement('div'); row.className = 'line';
        var nm = document.createElement('div'); nm.className = 'nm';
        nm.appendChild(document.createTextNode(String(l.n||'')));
        if(l.pack){ var sm = document.createElement('small'); sm.textContent = String(l.pack); nm.appendChild(sm); }
        var qty = Number(l.q)||1;
        var pr = document.createElement('div'); pr.className = 'pr';
        pr.textContent = qty + ' × ' + eur(l.c);
        row.appendChild(nm); row.appendChild(pr); box.appendChild(row);
      });
      $('vItems').textContent = eur(snap.raw);
      var disc = (Number(snap.raw)||0) - (Number(snap.items)||0);
      $('rowDisc').hidden = !(disc > 0);
      if(disc > 0){ $('lDisc').textContent = d.discount + (snap.pct ? ' (' + Number(snap.pct) + '%)' : ''); $('vDisc').textContent = '−' + eur(disc); }
      $('vShip').textContent = Number(snap.ship) > 0 ? eur(snap.ship) : d.free;
      $('vTotal').textContent = eur((Number(snap.items)||0) + (Number(snap.ship)||0));
      $('sum').hidden = false;
      if(snap.email){ $('mailAddr').textContent = String(snap.email); $('mailLine').hidden = false; }
    }
  }

  var wrap = $('langs');
  Object.keys(T).forEach(function(code){
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('data-lang', code);
    var im = document.createElement('img'); im.alt = ''; im.src = FLAG[code.toUpperCase()];
    var sp = document.createElement('span'); sp.textContent = NAMES[code];
    b.appendChild(im); b.appendChild(sp); b.title = NAMES[code];
    b.addEventListener('click', function(){ lang = code; try{ localStorage.setItem(KEY, code); }catch(e){} render(); });
    wrap.appendChild(b);
  });
  $('yr').textContent = '© ' + new Date().getFullYear();

  if(okId){ $('orderNum').textContent = q; $('orderBox').hidden = false; }
  // The payment went through, so empty the shopper's cart (once) — only when this is the order this browser just paid for.
  if(snap && !snap.cleared){
    try{
      localStorage.setItem('supplab_cart', '{}');
      snap.cleared = true; localStorage.setItem('supplab_last_order', JSON.stringify(snap));
    }catch(e){}
  }
  render();
})();
</script>
